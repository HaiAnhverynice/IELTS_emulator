<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="560" height="420" fill="#eef6ec" stroke="#222" stroke-width="2"/>

  <!-- Lake -->
  <ellipse cx="410" cy="120" rx="100" ry="60" fill="#bcd9f0" stroke="#4a7fb5" stroke-width="2"/>
  <text x="410" y="125" font-size="14" fill="#2c5d86" text-anchor="middle">Lake</text>

  <!-- Pond -->
  <circle cx="180" cy="210" r="34" fill="#bcd9f0" stroke="#4a7fb5" stroke-width="2"/>
  <text x="180" y="215" font-size="12" fill="#2c5d86" text-anchor="middle">Pond</text>

  <!-- Main path (vertical) -->
  <path d="M275 400 L275 60" stroke="#caa46b" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Side path to lake -->
  <path d="M275 150 L360 120" stroke="#caa46b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Side path to pond -->
  <path d="M275 210 L214 210" stroke="#caa46b" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Big oak (centre) -->
  <circle cx="300" cy="250" r="16" fill="#5a8f4a"/>
  <text x="300" y="285" font-size="11" fill="#3a5d31" text-anchor="middle">Old oak</text>

  <!-- Entrance / main gate (bottom) -->
  <rect x="248" y="392" width="54" height="16" fill="#8a6d3b"/>
  <text x="275" y="380" font-size="12" fill="#5a4626" text-anchor="middle">Main gate</text>
  <path d="M275 392 l-10 -14 h20 z" fill="#5a4626"/>

  <!-- Buildings / markers A–F -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <!-- A: bottom-left -->
    <rect x="70" y="330" width="46" height="40" fill="#f4d58d" stroke="#222" stroke-width="2"/>
    <text x="93" y="357" fill="#222">A</text>

    <!-- B: just right of gate (entrance right) -->
    <rect x="320" y="330" width="46" height="40" fill="#f4d58d" stroke="#222" stroke-width="2"/>
    <text x="343" y="357" fill="#222">B</text>

    <!-- C: centre, beside the old oak -->
    <rect x="330" y="232" width="40" height="36" fill="#f4d58d" stroke="#222" stroke-width="2"/>
    <text x="350" y="256" fill="#222">C</text>

    <!-- D: left, just past the pond -->
    <rect x="120" y="150" width="46" height="40" fill="#f4d58d" stroke="#222" stroke-width="2"/>
    <text x="143" y="177" fill="#222">D</text>

    <!-- E: bottom-right corner -->
    <rect x="470" y="330" width="46" height="40" fill="#f4d58d" stroke="#222" stroke-width="2"/>
    <text x="493" y="357" fill="#222">E</text>

    <!-- F: top corner overlooking the lake -->
    <rect x="470" y="40" width="46" height="40" fill="#f4d58d" stroke="#222" stroke-width="2"/>
    <text x="493" y="67" fill="#222">F</text>
  </g>
</svg>
